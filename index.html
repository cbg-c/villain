<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Villain Blind Rank</title>
    <style>
        :root {
            --bg-color: #1a1a24;
            --card-bg: #2d2d3f;
            --accent: #ff4757;
            --accent-hover: #ff6b81;
            --text-main: #ffffff;
            --text-sub: #a4b0be;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            color: var(--text-sub);
            margin-bottom: 30px;
            text-align: center;
        }

        #game-board {
            width: 100%;
            max-width: 500px;
        }

        #current-villain-card {
            background: var(--card-bg);
            padding: 30px 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 30px;
            border: 2px solid var(--accent);
            min-height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.15);
            transition: transform 0.1s ease;
        }

        /* Animation class for the card while rolling */
        .is-rolling {
            animation: shake 0.2s infinite;
            border-color: #ffffff !important;
        }

        @keyframes shake {
            0% { transform: translateY(0); }
            25% { transform: translateY(-3px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(3px); }
            100% { transform: translateY(0); }
        }

        #villain-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            margin-bottom: 15px;
            background-color: #1a1a24;
        }

        #villain-name {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
        }

        #villain-origin {
            margin: 5px 0 0 0;
            color: var(--text-sub);
            font-style: italic;
            font-size: 1rem;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        button:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        .slot {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            margin-bottom: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 60px;
            border: 1px solid transparent;
            overflow: hidden;
        }

        /* Disable slot interaction while the wheel is spinning */
        .slots-locked .slot {
            pointer-events: none;
            opacity: 0.7;
        }

        .slot:hover:not(.filled) {
            border-color: var(--accent);
            background: #3a3a52;
            transform: translateX(5px);
        }

        .slot.filled {
            background: var(--accent);
            cursor: default;
            color: white;
        }

        .rank-num {
            font-size: 1.4rem;
            font-weight: bold;
            width: 50px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px 0 0 8px;
            flex-shrink: 0;
        }

        .slot-content {
            padding-left: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <h1>Blind Rank</h1>
    <p class="subtitle">Which Villain would you most likely be able to fend off from your love</p>

    <div id="game-board" class="slots-locked">
        <div id="current-villain-card">
            <img id="villain-img" class="hidden" src="" alt="Villain Image" onerror="this.onerror=null; usePlaceholder(this);">
            <h2 id="villain-name" class="hidden"></h2>
            <p id="villain-origin" class="hidden"></p>
            <button id="start-btn">Start Game</button>
        </div>

        <div id="rank-list">
            <!-- JavaScript populates slots 1 to 10 here -->
        </div>
    </div>

    <script>
        // --- HOW TO ADD IMAGES ---
        // 1. Create a folder named 'images' in the same folder as this index.html file.
        // 2. Place JPG images inside that folder.
        // 3. Ensure the filenames match exactly what is listed below (e.g., darth_vader.jpg).

        const rawVillains = [
            { name: "Darth Vader", origin: "Star Wars", image: "images/darth_vader.jpg" },
            { name: "The Joker", origin: "DC Comics / Batman", image: "images/joker.jpg" },
            { name: "Hannibal Lecter", origin: "The Silence of the Lambs", image: "images/hannibal_lecter.jpg" },
            { name: "Lord Voldemort", origin: "Harry Potter", image: "images/voldemort.jpg" },
            { name: "Sauron", origin: "The Lord of the Rings", image: "images/sauron.jpg" },
            { name: "Norman Bates", origin: "Psycho", image: "images/norman_bates.jpg" },
            { name: "Anton Chigurh", origin: "No Country for Old Men", image: "images/anton_chigurh.jpg" },
            { name: "Thanos", origin: "Marvel Cinematic Universe", image: "images/thanos.jpg" },
            { name: "Emperor Palpatine", origin: "Star Wars", image: "images/palpatine.jpg" },
            { name: "Magneto", origin: "X-Men", image: "images/magneto.jpg" },
            { name: "Lex Luthor", origin: "Superman", image: "images/lex_luthor.jpg" },
            { name: "Wicked Witch of the West", origin: "The Wizard of Oz", image: "images/wicked_witch.jpg" },
            { name: "Michael Myers", origin: "Halloween", image: "images/michael_myers.jpg" },
            { name: "Freddy Krueger", origin: "A Nightmare on Elm Street", image: "images/freddy_krueger.jpg" },
            { name: "Jason Voorhees", origin: "Friday the 13th", image: "images/jason_voorhees.jpg" },
            { name: "T-800 Terminator", origin: "The Terminator", image: "images/t800.jpg" },
            { name: "Gollum", origin: "The Lord of the Rings", image: "images/gollum.jpg" },
            { name: "Scar", origin: "The Lion King", image: "images/scar.jpg" },
            { name: "Joffrey Baratheon", origin: "Game of Thrones", image: "images/joffrey_baratheon.jpg" },
            { name: "Night King", origin: "Game of Thrones", image: "images/night_king.jpg" },
            { name: "Homelander", origin: "The Boys", image: "images/homelander.jpg" },
            { name: "Gus Fring", origin: "Breaking Bad", image: "images/gus_fring.jpg" },
            { name: "Negan", origin: "The Walking Dead", image: "images/negan.jpg" },
            { name: "Bowser", origin: "Super Mario Bros.", image: "images/bowser.jpg" },
            { name: "Ganondorf", origin: "The Legend of Zelda", image: "images/ganondorf.jpg" },
            { name: "Albert Wesker", origin: "Resident Evil", image: "images/albert_wesker.jpg" },
            { name: "Dracula", origin: "Castlevania / Universal", image: "images/dracula.jpg" },
            { name: "The Lich King (Arthas)", origin: "World of Warcraft", image: "images/lich_king.jpg" },
            { name: "Nemesis", origin: "Resident Evil 3", image: "images/nemesis.jpg" },
            { name: "Pyramid Head", origin: "Silent Hill 2", image: "images/pyramid_head.jpg" },
            { name: "Ridley", origin: "Metroid", image: "images/ridley.jpg" },
            { name: "Maleficent", origin: "Sleeping Beauty", image: "images/maleficent.jpg" },
            { name: "Ursula", origin: "The Little Mermaid", image: "images/ursula.jpg" },
            { name: "Jafar", origin: "Aladdin", image: "images/jafar.jpg" },
            { name: "Gaston", origin: "Beauty and the Beast", image: "images/gaston.jpg" },
            { name: "Yzma", origin: "The Emperor's New Groove", image: "images/yzma.jpg" },
            { name: "Kylo Ren", origin: "Star Wars", image: "images/kylo_ren.jpg" },
            { name: "General Grievous", origin: "Star Wars", image: "images/general_grievous.jpg" },
            { name: "Green Goblin", origin: "Spider-Man", image: "images/green_goblin.jpg" },
            { name: "Doctor Octopus", origin: "Spider-Man", image: "images/doctor_octopus.jpg" },
            { name: "Venom", origin: "Spider-Man", image: "images/venom.jpg" },
            { name: "Loki", origin: "Marvel Cinematic Universe", image: "images/loki.jpg" },
            { name: "Hela", origin: "Thor: Ragnarok", image: "images/hela.jpg" },
            { name: "Ultron", origin: "Avengers: Age of Ultron", image: "images/ultron.jpg" },
            { name: "Bane", origin: "Batman", image: "images/bane.jpg" },
            { name: "Pennywise", origin: "IT", image: "images/pennywise.jpg" }
        ];

        // Process the database (fallback mechanism happens live via onerror)
        const villainsDatabase = [...rawVillains];

        let availableVillains = [...villainsDatabase];
        let currentVillain = null;
        let slotsFilled = 0;
        let isRolling = false;

        // Initialize UI elements
        const rankList = document.getElementById('rank-list');
        const gameBoard = document.getElementById('game-board');
        const villainImg = document.getElementById('villain-img');
        
        // Populate the 10 ranking slots
        for (let i = 1; i <= 10; i++) {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.dataset.index = i;
            
            const num = document.createElement('span');
            num.className = 'rank-num';
            num.innerText = i;
            
            const content = document.createElement('span');
            content.className = 'slot-content';
            
            slot.appendChild(num);
            slot.appendChild(content);
            rankList.appendChild(slot);
        }

        // Fallback function if local image isn't found
        function usePlaceholder(imgElement) {
            if (!currentVillain && !isRolling) return; 
            
            // Note: During rapid animation, currentVillain isn't always set yet, 
            // but the src update triggers onerror. This live fallback handles it.
            // When not animating, we use currentVillain name, otherwise a general placeholder.
            const nameToEncode = currentVillain ? currentVillain.name : "V";
            const encodedName = encodeURIComponent(nameToEncode);
            imgElement.src = `https://ui-avatars.com/api/?name=${encodedName}&background=2d2d3f&color=ff4757&size=150&bold=true`;
        }

        // Updates the card UI with a specific villain's data
        function updateCardUI(villain) {
            document.getElementById('villain-name').innerText = villain.name;
            document.getElementById('villain-origin').innerText = villain.origin;
            // Set source - if file doesn't exist, HTML onerror attribute calls usePlaceholder()
            villainImg.src = villain.image;
        }

        // The Rolling Animation Logic
        function animateRoll(callback) {
            isRolling = true;
            gameBoard.classList.add('slots-locked');
            document.getElementById('current-villain-card').classList.add('is-rolling');

            let rollCount = 0;
            let delay = 40; // Start speed

            function rollStep() {
                // Show a random temporary villain from the original database for visual effect
                const randomTemp = villainsDatabase[Math.floor(Math.random() * villainsDatabase.length)];
                updateCardUI(randomTemp);

                rollCount++;

                if (rollCount < 15) {
                    // Constant fast speed
                    setTimeout(rollStep, delay);
                } else if (rollCount < 25) {
                    // Slowing down
                    delay += 25;
                    setTimeout(rollStep, delay);
                } else {
                    // Finish animation
                    document.getElementById('current-villain-card').classList.remove('is-rolling');
                    callback(); 
                }
            }
            rollStep();
        }

        // Logic to draw the actual random villain
        function drawFinalVillain() {
            const randIndex = Math.floor(Math.random() * availableVillains.length);
            currentVillain = availableVillains[randIndex];
            
            // Remove them from the pool for this session
            availableVillains.splice(randIndex, 1);
            
            // Set UI to final villain and unlock slots
            updateCardUI(currentVillain);
            isRolling = false;
            gameBoard.classList.remove('slots-locked');
        }

        function triggerNewVillain() {
            if (slotsFilled >= 10) return; 
            currentVillain = null; // Clear previous selection before animation starts
            animateRoll(drawFinalVillain);
        }

        // Handle clicking on a slot
        document.querySelectorAll('.slot').forEach(slot => {
            slot.addEventListener('click', () => {
                if (isRolling || !currentVillain) return; // Prevent interaction during spin
                if (slot.classList.contains('filled')) return; // Slot already taken
                
                // Add text and mark slot as filled
                slot.querySelector('.slot-content').innerText = `${currentVillain.name} (${currentVillain.origin})`;
                slot.classList.add('filled');
                
                slotsFilled++;
                
                if (slotsFilled < 10) {
                    triggerNewVillain();
                } else {
                    // List is complete
                    villainImg.classList.add('hidden');
                    document.getElementById('villain-name').innerText = "List Complete!";
                    document.getElementById('villain-origin').innerText = "Screenshot to share your blind ranking.";
                }
            });
        });

        // Start button initialization
        document.getElementById('start-btn').addEventListener('click', (e) => {
            e.target.classList.add('hidden');
            villainImg.classList.remove('hidden');
            document.getElementById('villain-name').classList.remove('hidden');
            document.getElementById('villain-origin').classList.remove('hidden');
            triggerNewVillain();
        });
    </script>
</body>
</html>
