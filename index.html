<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Blind Rank</title><style>
:root{--bg:#1a1a24;--cb:#2d2d3f;--ac:#ff4757;--ach:#ff6b81;--tm:#fff;--ts:#a4b0be}
body{font-family:sans-serif;background:var(--bg);color:var(--tm);margin:0;padding:15px;display:flex;flex-direction:column;align-items:center}
h1{color:var(--ac);text-transform:uppercase;letter-spacing:2px;text-align:center;margin-bottom:5px;font-size:1.6rem}
.subtitle{color:var(--ts);margin-top:0;margin-bottom:20px;text-align:center}
#game-board{width:100%;max-width:1000px;display:flex;flex-direction:column;align-items:center}
#roller{display:flex;flex-direction:column;align-items:center;width:100%;transition:transform .1s}
#current-villain-card{text-align:center;margin-bottom:15px;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}
.is-rolling{animation:shake .2s infinite}.is-rolling #villain-img{border-color:#fff!important}
@keyframes shake{0%,100%{transform:translateY(0)}25%{transform:translateY(-3px)}75%{transform:translateY(3px)}}
#villain-img{width:400px;height:400px;max-width:100%;border-radius:12px;object-fit:cover;object-position:center top;border:3px solid var(--ac);margin-bottom:5px;background:var(--bg);box-shadow:0 8px 20px rgba(255,71,87,.2)}
#villain-name{margin:0;font-size:1.8rem;font-weight:800}#villain-origin{margin:2px 0 15px;color:var(--ts);font-style:italic;font-size:1rem}
button{background:var(--ac);color:#fff;border:none;padding:12px 30px;font-size:1.2rem;font-weight:700;border-radius:8px;cursor:pointer;transition:all .2s;text-transform:uppercase}
button:hover{background:var(--ach);transform:scale(1.05)}
#rank-list{display:grid;grid-template-rows:repeat(5,auto);grid-template-columns:repeat(2,1fr);grid-auto-flow:column;gap:10px;width:100%;margin-top:15px}.slot-wrapper{position:relative;width:100%}
.slot{display:flex;align-items:center;background:var(--cb);border-radius:8px;cursor:pointer;transition:all .2s;height:52px;border:1px solid transparent;overflow:hidden;width:100%}
.slots-locked .slot{pointer-events:none;opacity:.7}.slot:hover:not(.filled){border-color:var(--ac);background:#3a3a52;transform:translateX(5px)}
.slot.filled{background:var(--ac);cursor:default;color:#fff}
.rank-num{font-size:1.4rem;font-weight:700;width:50px;text-align:center;background:rgba(0,0,0,.3);height:100%;display:flex;align-items:center;justify-content:center;border-radius:8px 0 0 8px;flex-shrink:0}
.slot-content{padding-left:15px;font-size:1.1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.faint-label{position:absolute;font-size:.8rem;color:var(--ts);opacity:.7;white-space:nowrap;pointer-events:none}.hidden{display:none!important}
@media(max-width:600px){#rank-list{grid-template-rows:none;grid-auto-flow:row;grid-template-columns:1fr}}
</style></head>
<body><h1>Which villains can you fend off from attacking me?</h1><p class="subtitle"></p>
<div id="game-board" class="slots-locked"><div id="roller">
<img id="villain-img" class="hidden" src="" alt="Villain" onerror="usePlaceholder(this)">
<div id="current-villain-card"><h2 id="villain-name" class="hidden"></h2><p id="villain-origin" class="hidden"></p>
<button id="start-btn">Start Game</button></div></div><div id="rank-list"></div></div>
<script>
const rawVillains=[

{name:"Freddy Krueger",origin:"A Nightmare on Elm Street",image:"images/freddy_krueger.jpg"},{name:"Jason Voorhees",origin:"Friday the 13th",image:"images/jason_voorhees.jpg"},{name:"T-800 Terminator",origin:"The Terminator",image:"images/t800.jpg"},

let availableVillains=[...rawVillains],currentVillain=null,slotsFilled=0,isRolling=!1;
const rankList=document.getElementById("rank-list"),gameBoard=document.getElementById("game-board"),villainImg=document.getElementById("villain-img");
for(let e=1;e<=10;e++){const t=document.createElement("div");t.className="slot-wrapper";const n=document.createElement("div");n.className="slot",n.dataset.index=e;

if(1===e){const e=document.createElement("span");e.className="faint-label",e.innerText="ezpz";e.style.top="-20px",e.style.left="5px",t.appendChild(e)}
if(10===e){const e=document.createElement("span");e.className="faint-label",e.innerText="we're FUCKED";e.style.bottom="-20px",e.style.right="5px",t.appendChild(e)}rankList.appendChild(t)}
function usePlaceholder(e){const t=currentVillain?currentVillain.name:"V";e.src=`https://ui-avatars.com/api/?name=${encodeURIComponent(t)}&background=2d2d3f&color=ff4757&size=150&bold=true`}
function updateCardUI(e){document.getElementById("villain-name").innerText=e.name;document.getElementById("villain-origin").innerText=e.origin,villainImg.src=e.image}
function animateRoll(e){isRolling=!0,gameBoard.classList.add("slots-locked"),document.getElementById("roller").classList.add("is-rolling");let t=0,n=40;
!function l(){updateCardUI(rawVillains[Math.floor(Math.random()*rawVillains.length)]),t++,t<15?setTimeout(l,n):t<25?(n+=25,setTimeout(l,n)):(document.getElementById("roller").classList.remove("is-rolling"),e())}()}
function drawFinalVillain(){const e=Math.floor(Math.random()*availableVillains.length);currentVillain=availableVillains[e],availableVillains.splice(e,1);
updateCardUI(currentVillain);isRolling=!1,gameBoard.classList.remove("slots-locked")}
function triggerNewVillain(){slotsFilled>=10||(currentVillain=null,animateRoll(drawFinalVillain))}
document.querySelectorAll(".slot").forEach((e=>{e.addEventListener("click",(()=>{if(isRolling||!currentVillain||e.classList.contains("filled"))return;
e.querySelector(".slot-content").innerText=`${currentVillain.name} (${currentVillain.origin})`,e.classList.add("filled");
slotsFilled++,slotsFilled<10?triggerNewVillain():(villainImg.classList.add("hidden"),document.getElementById("villain-name").innerText="List Complete!",document.getElementById("villain-origin").innerText="Screenshot to share.")}))}));

document.getElementById("villain-name").classList.remove("hidden"),document.getElementById("villain-origin").classList.remove("hidden");triggerNewVillain()}));
