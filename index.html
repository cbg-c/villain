<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Blind Rank</title>
<style>:root{--bg:#1a1a24;--cb:#2d2d3f;--ac:#ff4757;--ach:#ff6b81;--tm:#fff;--ts:#a4b0be}body{font-family:sans-serif;background:var(--bg);color:var(--tm);margin:0;padding:20px;display:flex;flex-direction:column;align-items:center}h1{color:var(--ac);text-transform:uppercase;letter-spacing:2px;text-align:center;margin-bottom:5px}.subtitle{color:var(--ts);margin-bottom:30px;text-align:center}#game-board{width:100%;max-width:800px;display:flex;flex-direction:column;align-items:center}#roller{display:flex;flex-direction:column;align-items:center;width:100%;transition:transform .1s}#current-villain-card{background:var(--cb);padding:20px;border-radius:12px;text-align:center;margin-bottom:30px;border:2px solid var(--ac);width:100%;max-width:500px;min-height:100px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 8px 20px rgba(255,71,87,.15)}.is-rolling{animation:shake .2s infinite;border-color:#fff!important}@keyframes shake{0%,100%{transform:translateY(0)}25%{transform:translateY(-3px)}75%{transform:translateY(3px)}}#villain-img{width:250px;height:250px;border-radius:12px;object-fit:contain;border:3px solid var(--ac);margin-bottom:20px;background:#1a1a24;box-shadow:0 8px 20px rgba(255,71,87,.2)}#villain-name{margin:0;font-size:1.8rem;font-weight:800}#villain-origin{margin:5px 0 0;color:var(--ts);font-style:italic;font-size:1rem}button{background:var(--ac);color:#fff;border:none;padding:12px 30px;font-size:1.2rem;font-weight:700;border-radius:8px;cursor:pointer;transition:all .2s;text-transform:uppercase}button:hover{background:var(--ach);transform:scale(1.05)}#rank-list{display:grid;grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:12px;width:100%}.slot{display:flex;align-items:center;background:var(--cb);border-radius:8px;cursor:pointer;transition:all .2s;height:60px;border:1px solid transparent;overflow:hidden}.slots-locked .slot{pointer-events:none;opacity:.7}.slot:hover:not(.filled){border-color:var(--ac);background:#3a3a52;transform:translateX(5px)}.slot.filled{background:var(--ac);cursor:default;color:#fff}.rank-num{font-size:1.4rem;font-weight:700;width:50px;text-align:center;background:rgba(0,0,0,.3);height:100%;display:flex;align-items:center;justify-content:center;border-radius:8px 0 0 8px;flex-shrink:0}.slot-content{padding-left:15px;font-size:1.1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hidden{display:none!important}@media(max-width:600px){#rank-list{grid-template-rows:none;grid-auto-flow:row;grid-template-columns:1fr}}</style></head>
<body><h1>Blind Rank - Top Villains</h1><p class="subtitle">Which can you fend off from attacking me?</p>
<div id="game-board" class="slots-locked"><div id="roller"><img id="villain-img" class="hidden" src="" alt="Villain" onerror="usePlaceholder(this)"><div id="current-villain-card"><h2 id="villain-name" class="hidden"></h2><p id="villain-origin" class="hidden"></p><button id="start-btn">Start Game</button></div></div><div id="rank-list"></div></div>
<script>
const rawVillains=[
{name:"Darth Vader",origin:"Star Wars",image:"images/darth_vader.jpg"},{name:"The Joker",origin:"DC Comics / Batman",image:"images/joker.jpg"},{name:"Hannibal Lecter",origin:"The Silence of the Lambs",image:"images/hannibal_lecter.jpg"},{name:"Lord Voldemort",origin:"Harry Potter",image:"images/voldemort.jpg"},
{name:"Sauron",origin:"The Lord of the Rings",image:"images/sauron.jpg"},{name:"The Nun",origin:"The Conjuring Universe",image:"images/the_nun.jpg"},{name:"Anton Chigurh",origin:"No Country for Old Men",image:"images/anton_chigurh.jpg"},{name:"Thanos",origin:"Marvel Cinematic Universe",image:"images/thanos.jpg"},
{name:"Emperor Palpatine",origin:"Star Wars",image:"images/palpatine.jpg"},{name:"Magneto",origin:"X-Men",image:"images/magneto.jpg"},{name:"Lex Luthor",origin:"Superman",image:"images/lex_luthor.jpg"},{name:"Wicked Witch of the West",origin:"The Wizard of Oz",image:"images/wicked_witch.jpg"},
{name:"Michael Myers",origin:"Halloween",image:"images/michael_myers.jpg"},{name:"Freddy Krueger",origin:"A Nightmare on Elm Street",image:"images/freddy_krueger.jpg"},{name:"Jason Voorhees",origin:"Friday the 13th",image:"images/jason_voorhees.jpg"},{name:"T-800 Terminator",origin:"The Terminator",image:"images/t800.jpg"},
{name:"Gollum",origin:"The Lord of the Rings",image:"images/gollum.jpg"},{name:"Scar",origin:"The Lion King",image:"images/scar.jpg"},{name:"Joffrey Baratheon",origin:"Game of Thrones",image:"images/joffrey_baratheon.jpg"},{name:"Night King",origin:"Game of Thrones",image:"images/night_king.jpg"},
{name:"Homelander",origin:"The Boys",image:"images/homelander.jpg"},{name:"Gus Fring",origin:"Breaking Bad",image:"images/gus_fring.jpg"},{name:"Negan",origin:"The Walking Dead",image:"images/negan.jpg"},{name:"Bowser",origin:"Super Mario Bros.",image:"images/bowser.jpg"},{name:"Albert Wesker",origin:"Resident Evil",image:"images/albert_wesker.jpg"},{name:"Dracula",origin:"Castlevania / Universal",image:"images/dracula.jpg"},{name:"The Lich King (Arthas)",origin:"World of Warcraft",image:"images/lich_king.jpg"},
{name:"Nemesis",origin:"Resident Evil 3",image:"images/nemesis.jpg"},{name:"Pyramid Head",origin:"Silent Hill 2",image:"images/pyramid_head.jpg"},{name:"Maleficent",origin:"Sleeping Beauty",image:"images/maleficent.jpg"},
{name:"Death",origin:"Puss in Boots: The Last Wish",image:"images/death.jpg"},{name:"Jaws",origin:"Jaws",image:"images/jaws.jpg"},{name:"Megatron",origin:"Transformers",image:"images/megatron.jpg"},
{name:"Tai Lung",origin:"Kung Fu Panda",image:"images/tai_lung.jpg"},{name:"General Grievous",origin:"Star Wars",image:"images/general_grievous.jpg"},{name:"Green Goblin",origin:"Spider-Man",image:"images/green_goblin.jpg"},{name:"Doctor Octopus",origin:"Spider-Man",image:"images/doctor_octopus.jpg"},
{name:"Venom",origin:"Spider-Man",image:"images/venom.jpg"},{name:"Loki",origin:"Marvel Cinematic Universe",image:"images/loki.jpg"},{name:"Hela",origin:"Thor: Ragnarok",image:"images/hela.jpg"},{name:"Ultron",origin:"Avengers: Age of Ultron",image:"images/ultron.jpg"},
{name:"Bane",origin:"Batman",image:"images/bane.jpg"},{name:"Pennywise",origin:"IT",image:"images/pennywise.jpg"}];
let availableVillains=[...rawVillains],currentVillain=null,slotsFilled=0,isRolling=!1;const rankList=document.getElementById("rank-list"),gameBoard=document.getElementById("game-board"),villainImg=document.getElementById("villain-img");
for(let e=1;e<=10;e++){const t=document.createElement("div");t.className="slot",t.dataset.index=e;const n=document.createElement("span");n.className="rank-num",n.innerText=e;const l=document.createElement("span");l.className="slot-content",t.appendChild(n),t.appendChild(l),rankList.appendChild(t)}
function usePlaceholder(e){const t=currentVillain?currentVillain.name:"V";e.src=`https://ui-avatars.com/api/?name=${encodeURIComponent(t)}&background=2d2d3f&color=ff4757&size=150&bold=true`}
function updateCardUI(e){document.getElementById("villain-name").innerText=e.name,document.getElementById("villain-origin").innerText=e.origin,villainImg.src=e.image}
function animateRoll(e){isRolling=!0,gameBoard.classList.add("slots-locked"),document.getElementById("roller").classList.add("is-rolling");let t=0,n=40;!function l(){updateCardUI(rawVillains[Math.floor(Math.random()*rawVillains.length)]),t++,t<15?setTimeout(l,n):t<25?(n+=25,setTimeout(l,n)):(document.getElementById("roller").classList.remove("is-rolling"),e())}()}
function drawFinalVillain(){const e=Math.floor(Math.random()*availableVillains.length);currentVillain=availableVillains[e],availableVillains.splice(e,1),updateCardUI(currentVillain),isRolling=!1,gameBoard.classList.remove("slots-locked")}
function triggerNewVillain(){slotsFilled>=10||(currentVillain=null,animateRoll(drawFinalVillain))}
document.querySelectorAll(".slot").forEach((e=>{e.addEventListener("click",(()=>{isRolling||!currentVillain||e.classList.contains("filled")||(e.querySelector(".slot-content").innerText=`${currentVillain.name} (${currentVillain.origin})`,e.classList.add("filled"),slotsFilled++,slotsFilled<10?triggerNewVillain():(villainImg.classList.add("hidden"),document.getElementById("villain-name").innerText="List Complete!",document.getElementById("villain-origin").innerText="Screenshot to share your blind ranking."))}))})),document.getElementById("start-btn").addEventListener("click",(e=>{e.target.classList.add("hidden"),villainImg.classList.remove("hidden"),document.getElementById("villain-name").classList.remove("hidden"),document.getElementById("villain-origin").classList.remove("hidden"),triggerNewVillain()}));
</script></body></html>
